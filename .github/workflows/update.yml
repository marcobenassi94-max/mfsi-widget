name: MFSI Daily Update
on:
  schedule:
    # Una volta al giorno, dopo la chiusura di Wall Street (22:00 UTC = 18:00 New York in ora legale, 17:00 in ora solare).
    # Le esecuzioni durante la seduta usavano prezzi intraday e facevano oscillare lo score nella stessa giornata.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
jobs:
  update-mfsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install yfinance
      - run: python mfsi_updater.py
      - run: |
          git config user.email "mfsi-bot@noreply.github.com"
          git config user.name "MFSI Bot"
          git add data.json
          if [ -f spread_storico.json ]; then git add spread_storico.json; fi
          git commit -m "MFSI update $(date +'%Y-%m-%d')" || echo "Nessuna modifica"
          git push
